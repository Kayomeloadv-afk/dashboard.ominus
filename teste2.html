<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ominus Tech — Agendamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A84C;
            --black: #080808;
            --black-2: #111111;
            --black-3: #191919;
            --white: #F5F0E8;
            --radius: 12px;
            --border: 1px solid rgba(201,168,76,0.2);
        }

        body { background-color: var(--black); color: var(--white); font-family: 'Outfit', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        .card { background: var(--black-2); border: var(--border); border-radius: var(--radius); padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { text-align: center; font-size: 0.8rem; color: #999; margin-bottom: 30px; text-transform: uppercase; }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }

        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--gold); font-size: 0.9rem; }
        input, select {
            width: 100%; padding: 12px; background: var(--black-3); border: var(--border); border-radius: 8px; color: white; margin-bottom: 20px; box-sizing: border-box; font-family: 'Outfit';
        }

        /* Calendário */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--black-3); padding: 10px; border-radius: 8px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .weekday { color: var(--gold); font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }
        .day { padding: 12px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; background: rgba(255,255,255,0.03); }
        .day:hover:not(.empty) { background: var(--gold); color: black; }
        .day.selected { background: var(--gold); color: black; font-weight: bold; box-shadow: 0 0 15px rgba(201,168,76,0.4); }
        .day.today { border: 1px solid var(--gold); color: var(--gold); }
        .day.empty { background: transparent; cursor: default; }

        /* Grade de Horários */
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .time-slot { padding: 12px; background: var(--black-3); border: var(--border); border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .time-slot:hover:not(.ocupado) { border-color: var(--gold); color: var(--gold); }
        .time-slot.selected { background: var(--gold); color: black; border-color: var(--gold); font-weight: bold; }
        
        /* Estilo para Horário Ocupado */
        .time-slot.ocupado { 
            opacity: 0.2; 
            cursor: not-allowed; 
            text-decoration: line-through; 
            border-color: #444;
            pointer-events: none;
        }
        
        /* Estilo para Horário Agendado (Indisponível) */
        .time-slot.agendado {
            background: rgba(255, 0, 0, 0.15);
            border-color: #ff4444;
            color: #ff6b6b;
            cursor: not-allowed;
            pointer-events: none;
            font-weight: 600;
            box-shadow: inset 0 0 8px rgba(255, 0, 0, 0.2);
        }

        .btn {
            width: 100%; padding: 16px; background: var(--gold); border: none; border-radius: 8px; color: black; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; transition: 0.3s;
        }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); margin-top: 5px; font-size: 0.8rem; padding: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilos para Eventos */
        .events-list-container { margin-top: 20px; }
        .selected-date-title { font-family: 'Cinzel'; color: var(--gold); font-size: 1.1rem; margin-bottom: 15px; text-align: center; }
        .event-card {
            background: var(--black-3); border: var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .event-card:hover { border-color: var(--gold); box-shadow: 0 0 15px rgba(201,168,76,0.2); }
        .event-info { flex: 1; }
        .event-title { font-weight: 600; color: var(--white); margin-bottom: 5px; }
        .event-meta { display: flex; gap: 10px; font-size: 0.8rem; align-items: center; }
        .event-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-servico { background: rgba(201,168,76,0.2); color: var(--gold); }
        .delete-event {
            background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); color: #ff6b6b; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.3s;
        }
        .delete-event:hover { background: rgba(255,0,0,0.2); border-color: #ff6b6b; }
        .empty-events { text-align: center; color: #999; padding: 30px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>OMINUS</h1>
        <p class="subtitle">Barbearia Premium</p>

        <div class="step active" id="step-1">
            <label>1. Selecione o dia desejado:</label>
            <div class="calendar-header">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:var(--gold); cursor:pointer;">◀</button>
                <span id="monthDisplay"></span>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:var(--gold); cursor:pointer;">▶</button>
            </div>
            <div class="calendar-grid">
                <div class="weekday">DOM</div><div class="weekday">SEG</div><div class="weekday">TER</div>
                <div class="weekday">QUA</div><div class="weekday">QUI</div><div class="weekday">SEX</div><div class="weekday">SAB</div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <button class="btn" onclick="nextStep(2)" id="btnToStep2" style="display:none; margin-top:20px;">Continuar</button>
        </div>

        <div class="step" id="step-2">
            <label>2. Escolha um horário para o dia <span id="selectedDateDisplay" style="color:white"></span>:</label>
            <div class="time-grid" id="timeGrid"></div>
            
            <!-- Container para eventos/agendamentos do dia -->
            <div class="events-list-container" id="eventsListContainer" style="display:none;">
                <div class="selected-date-title">Agendamentos para <span id="selectedDateTitle"></span></div>
                <div id="eventsContent"></div>
            </div>

            <button class="btn" onclick="nextStep(3)" id="btnToStep3" style="display:none; margin-top:20px;">Próximo Passo</button>
            <button class="btn btn-outline" onclick="nextStep(1)">Voltar ao calendário</button>
        </div>

        <div class="step" id="step-3">
            <label>3. Quase pronto! Informe seus dados:</label>
            <input type="text" id="nome" placeholder="Seu nome completo">
            <input type="tel" id="whatsapp" placeholder="Seu WhatsApp (DDD + Número)">
            
            <label>Serviço desejado:</label>
            <select id="servico">
                <option value="Corte">Corte Tradicional</option>
                <option value="Barba">Barba Premium</option>
                <option value="Combo">Corte + Barba</option>
                <option value="Sobrancelha">Sobrancelha</option>
            </select>

            <button class="btn" id="btnFinalizar" onclick="enviarAgendamento()">Confirmar Agendamento</button>
            <button class="btn btn-outline" onclick="nextStep(2)">Voltar aos horários</button>
        </div>

        <div class="step" id="step-sucesso" style="text-align:center;">
            <div style="font-size: 50px; color: var(--gold); margin-bottom: 20px;">✓</div>
            <h2 style="font-family: 'Cinzel'">Confirmado!</h2>
            <p>Seu horário foi reservado com sucesso. Esperamos por você!</p>
            <button class="btn" onclick="location.reload()">Fazer outro agendamento</button>
        </div>
    </div>
</div>

<script>
    // URLs do n8n — Verifique se estão corretas!
    const WEBHOOK_URL = 'https://tyrannisingly-mesorrhine-anaya.ngrok-free.dev/webhook/agendamento';
    const CONSULTA_URL = 'https://tyrannisingly-mesorrhine-anaya.ngrok-free.dev/webhook/consultar-disponibilidade';
    
    let selectedDate = null;
    let selectedTime = null;
    let viewDate = new Date();

    function nextStep(step) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        if(step === 'sucesso') {
            document.getElementById(`step-sucesso`).classList.add('active');
        } else {
            document.getElementById(`step-${step}`).classList.add('active');
        }
        if(step === 1) renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');
        grid.innerHTML = '';
        
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        
        monthDisplay.innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(viewDate);

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="day empty"></div>`;

        for(let i=1; i<=lastDay; i++) {
            const isToday = new Date().getDate() === i && new Date().getMonth() === month && new Date().getFullYear() === year;
            grid.innerHTML += `<div class="day ${isToday ? 'today' : ''}" onclick="selectDay(${i})">${i}</div>`;
        }
    }

    function changeMonth(diff) {
        viewDate.setMonth(viewDate.getMonth() + diff);
        renderCalendar();
    }

    async function selectDay(day) {
        document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
        event.target.classList.add('selected');
        
        selectedDate = `${viewDate.getFullYear()}-${String(viewDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        document.getElementById('selectedDateDisplay').innerText = new Date(selectedDate + 'T00:00:00').toLocaleDateString('pt-BR');
        
        const timeGrid = document.getElementById('timeGrid');
        timeGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Consultando agenda...</p>';

        try {
            // Consulta os horários ocupados no n8n
            const response = await fetch(CONSULTA_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "ag-data": selectedDate })
            });
            
            const dados = await response.json();
            const ocupados = dados.ocupados || []; 
            
            renderTimes(ocupados);
            renderEventsForSelected(); // Renderiza agendamentos do dia
            document.getElementById('btnToStep2').style.display = 'block';
        } catch (error) {
            console.error("Erro ao carregar horários:", error);
            renderTimes([]);
            renderEventsForSelected(); // Renderiza agendamentos do dia mesmo com erro
            document.getElementById('btnToStep2').style.display = 'block';
        }
    }

    function renderTimes(ocupados = []) {
        const timeGrid = document.getElementById('timeGrid');
        timeGrid.innerHTML = '';
        
        const horariosPadrao = ['08:00', '09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
        
        // Obtém horários agendados para a data selecionada
        const agendadosNoDia = getEventsForDate(selectedDate);
        const horariosAgendados = agendadosNoDia.map(e => e.hora);
        
        horariosPadrao.forEach(h => {
            const estaOcupado = ocupados.includes(h);
            const estaAgendado = horariosAgendados.includes(h);
            
            const div = document.createElement('div');
            let className = 'time-slot';
            
            if (estaOcupado) {
                className += ' ocupado';
            } else if (estaAgendado) {
                className += ' agendado';
            }
            
            div.className = className;
            div.innerText = h;
            div.title = estaAgendado ? 'Horário já agendado' : (estaOcupado ? 'Indisponível' : 'Disponível');
            
            if (!estaOcupado && !estaAgendado) {
                div.onclick = () => selectTime(h);
            }
            timeGrid.appendChild(div);
        });
    }

    function selectTime(time) {
        document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
        event.target.classList.add('selected');
        selectedTime = time;
        document.getElementById('btnToStep3').style.display = 'block';
    }

    async function enviarAgendamento() {
        const nome = document.getElementById('nome').value;
        const zap = document.getElementById('whatsapp').value;

        if(!nome || !zap) {
            alert("Preencha seu nome e WhatsApp.");
            return;
        }

        const dados = {
            "ag-nome": nome,
            "ag-whatsapp": zap,
            "ag-servico": document.getElementById('servico').value,
            "ag-data": selectedDate,
            "ag-hora": selectedTime
        };

        const btn = document.getElementById('btnFinalizar');
        btn.innerText = "RESERVANDO...";
        btn.disabled = true;

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                // Salvar agendamento localmente
                const bookings = getStoredBookings();
                bookings.push({
                    id: `agd_${Date.now()}`,
                    nome: nome,
                    whatsapp: zap,
                    servico: document.getElementById('servico').value,
                    date: selectedDate,
                    hora: selectedTime
                });
                saveBookings(bookings);

                nextStep('sucesso');
            } else {
                alert("Erro ao agendar.");
                btn.innerText = "Confirmar Agendamento";
                btn.disabled = false;
            }
        } catch (error) {
            alert("Erro de conexão.");
            btn.innerText = "Confirmar Agendamento";
            btn.disabled = false;
        }
    }

    // ======== RENDERIZAÇÃO DE EVENTOS ========
    
    // Armazena agendamentos em localStorage (simulando um banco de dados)
    function getStoredBookings() {
        const data = localStorage.getItem('ominus_bookings');
        return data ? JSON.parse(data) : [];
    }

    function saveBookings(bookings) {
        localStorage.setItem('ominus_bookings', JSON.stringify(bookings));
    }

    // Obtém agendamentos para uma data específica
    function getEventsForDate(dateString) {
        const bookings = getStoredBookings();
        return bookings.filter(b => b.date === dateString);
    }

    // Função auxiliar para escapar HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Renderiza agendamentos do dia selecionado
    function renderEventsForSelected() {
        const events = getEventsForDate(selectedDate);
        const container = document.getElementById('eventsListContainer');
        const eventsContent = document.getElementById('eventsContent');
        const titleSpan = document.getElementById('selectedDateTitle');
        
        const optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
        const formattedDate = new Date(selectedDate + 'T00:00:00').toLocaleDateString('pt-BR', optionsDate);
        titleSpan.innerText = formattedDate;

        if (!events.length) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';
        let html = '';

        events.forEach(ev => {
            const badgeClass = 'badge-servico';
            const serviceLabel = ev.servico || 'Corte';
        });

        eventsContent.innerHTML = html;
    }

   

    renderCalendar();
</script>
</body>
</html>
